[project]
name = "obsbotd"
version = "0.1.0"
description = "OBSBOT camera MCP daemon: single owner, hotplug-aware, honest errors"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9",
]

[project.scripts]
obsbotd = "obsbotd.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["obsbotd"]
